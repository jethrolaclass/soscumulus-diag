name = "soscumulus-diag-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Domaine personnalisé. `custom_domain` crée l'enregistrement DNS et demande
# le certificat — contrairement à une simple `route`, qui suppose un
# enregistrement existant et n'aurait rien résolu.
#
# Deuxième niveau volontairement : le SSL universel ne couvre pas les
# sous-domaines de troisième niveau, et api.diag.soscumulus.fr aurait imposé
# Advanced Certificate Manager.
routes = [
  { pattern = "diag-api.soscumulus.fr", custom_domain = true }
]

# Variables non sensibles. Les secrets passent par `wrangler secret put` :
#   ANTHROPIC_API_KEY, SIGNING_KEY, SMS_API_KEY, LEAD_SECRET, REPORT_SECRET
[vars]
PUBLIC_API_URL    = "https://diag-api.soscumulus.fr"
PUBLIC_WEB_URL    = "https://diag.soscumulus.fr"
REPORT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwbiwEGuzsHFBcO95SOail-bh7kaqvbE8FHLq87b8gRJ9Eus1tFIsbma_LGgJt7Kj5u/exec"
# Expéditeur alphanumérique : 11 caractères maximum, espace compris — et
# « SOS Cumulus » en fait exactement 11. Rien à ajouter sans retirer ailleurs.
SMS_SENDER        = "SOS Cumulus"
EMERGENCY_PHONE   = "+33621560983"
# En service : vide, donc tout client recevant un lien reçoit son SMS.
# La remplir de numéros séparés par des virgules referme l'envoi sur eux seuls —
# les autres dossiers restent créés et leur lien valide, mais rien ne part, et
# l'e-mail de lead le signale à l'équipe.
SMS_ALLOWLIST     = ""
# Same rule, voice path only: texts triggered by the phone agent go to these
# numbers and no other. Empty would open it to every caller. It stays filled
# while the agent is being tested by ear, because a tester who gives a random
# number would otherwise put a real link on a stranger's phone.
SMS_ALLOWLIST_VOICE = "+33621560983,+33699872414,+33684780721"
LOG_USAGE         = "true"

[[d1_databases]]
binding       = "DB"
database_name = "soscumulus-diag"
database_id   = "0baff45c-afca-4306-81c2-4ab27c28e88a"

[[r2_buckets]]
binding     = "PHOTOS"
bucket_name = "soscumulus-diag-r1"

# Purge RGPD quotidienne. Le Cron gratuit est limité à 5 déclencheurs par
# compte : celui-ci est le seul dont le service a besoin.
[triggers]
# 03:17 — retention purge. Every two minutes — finishes the syntheses whose
# background continuation was cut at the platform's thirty-second ceiling.
crons = ["17 3 * * *", "*/2 * * * *"]

[observability]
enabled = true
