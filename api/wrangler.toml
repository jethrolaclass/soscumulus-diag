name = "soscumulus-diag-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Variables non sensibles. Les secrets passent par `wrangler secret put` :
#   ANTHROPIC_API_KEY, SIGNING_KEY, SMS_API_KEY, LEAD_SECRET, FICHE_SECRET
[vars]
PUBLIC_API_URL    = "https://soscumulus-diag-api.maxime-peron.workers.dev"
PUBLIC_WEB_URL    = "https://soscumulus-diag.pages.dev"
FICHE_WEBHOOK_URL = ""
SMS_SENDER        = "SOSCumulus"
URGENCE_TEL       = "+33621560983"
LOG_USAGE         = "true"

[[d1_databases]]
binding       = "DB"
database_name = "soscumulus-diag"
database_id   = "0baff45c-afca-4306-81c2-4ab27c28e88a"

[[r2_buckets]]
binding     = "PHOTOS"
bucket_name = "soscumulus-diag-r1"

# Purge RGPD quotidienne. Le Cron gratuit est limité à 5 déclencheurs par
# compte : celui-ci est le seul dont le service a besoin.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
